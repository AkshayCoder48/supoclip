# SupoClip all-in-one nginx configuration (template).
# render/entrypoint.sh replaces __PORT__ with $PORT (Render) before start.
# Render's edge terminates TLS; this proxy only speaks plain HTTP internally.

daemon off;
user www-data;
worker_processes auto;
pid /run/supoclip/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75s;
    server_tokens off;

    # Uploads up to MAX_VIDEO_UPLOAD_BYTES (4 GB default) plus overhead.
    client_max_body_size 4300m;
    client_body_timeout 600s;

    # SSE-friendly defaults: never buffer proxied responses.
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
    proxy_request_buffering off;

    # Node/uvicorn close keepalives abruptly during deploys.
    proxy_next_upstream error timeout http_502 http_503 http_504;

    server {
        listen __PORT__ default_server;
        listen [::]:__PORT__ default_server;
        server_name _;

        # ---- Public REST API (agents & MCP clients) ----
        # https://<app>.onrender.com/b/tasks/  ->  backend /tasks/
        # Trailing slash on proxy_pass strips the /b/ prefix.
        location /b/ {
            proxy_pass http://127.0.0.1:8000/;
        }

        # ---- Everything else: Next.js frontend ----
        # Includes the app pages and the frontend's own /api/* routes
        # (auth, task proxying, uploads, fonts, ...), which the browser
        # uses exclusively. The backend is never called cross-origin by
        # the browser.
        location / {
            proxy_pass http://127.0.0.1:3107;
        }
    }
}
