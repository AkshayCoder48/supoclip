; Included by render/supervisord.conf only when ENABLE_AI_WORKER=1.
; The AI-edit worker answers editor instructions on its own arq queue.

[program:ai-worker]
command=bash -c ". /run/supoclip/env.sh && exec /app/.venv/bin/arq src.workers.ai_worker.AIWorkerSettings"
directory=/app
priority=45
autostart=true
autorestart=true
startsecs=15
startretries=10
stopwaitsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
