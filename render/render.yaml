# Render Blueprint for a fresh SupoClip all-in-one web service.
#
# If you already created a service (like rnd_5VNlC3fNJiq92L6WUG0ukxGi4ZTN),
# do NOT use this file — configure that service manually per
# render/RENDER_DEPLOY.md (Settings -> Build & Deploy).
#
# Plan notes:
#   - free    : 512 MB, no persistent disk. Testing only: the database is
#               wiped on every deploy, and 1080p renders will OOM. Use
#               YOUTUBE_MAX_HEIGHT=480 and short sources.
#   - starter : 512 MB + disk. Still tight for rendering.
#   - standard (2 GB) or larger: recommended for real clip generation.

services:
  - type: web
    name: supoclip
    runtime: docker
    dockerfilePath: ./render/Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /b/health/db
    disk:
      name: supoclip-data
      mountPath: /data
      sizeGB: 15
    envVars:
      # --- Required for a usable pipeline (set in dashboard prompts) ---
      - key: ASSEMBLY_AI_API_KEY
        sync: false
      - key: LLM
        value: google-gla:gemini-3-flash-preview
      - key: GOOGLE_API_KEY
        sync: false
      # --- Strongly recommended: YouTube from a datacenter IP ---
      # Without one of these, YouTube downloads will usually be blocked
      # ("Sign in to confirm you're not a bot") from Render's network.
      - key: APIFY_API_TOKEN
        sync: false
      # Example residential proxy instead of Apify:
      # - key: YOUTUBE_PROXY_URL
      #   sync: false
      # --- Tuning baked into the image; override freely ---
      - key: YOUTUBE_MAX_HEIGHT
        value: "720"
      - key: MAX_VIDEO_DURATION
        value: "2700"
      - key: MAX_CLIPS
        value: "6"
      - key: DISABLE_SIGN_UP
        value: "false"
      - key: ENABLE_AI_WORKER
        value: "0"
