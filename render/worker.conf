; Video worker + embedded cron worker.
; Copied into /render/programs/ by render/entrypoint.sh unless
; ENABLE_VIDEO_WORKER=0 (512 MB free plan: the worker's cv2/whisper
; imports do not fit alongside backend+frontend+postgres+redis).
[program:worker]
command=bash -c ". /run/supoclip/env.sh && export DATABASE_URL=\"$BACKEND_DATABASE_URL\" && exec /app/.venv/bin/python -m src.workers.run_workers"
directory=/app
priority=40
autostart=true
autorestart=true
startsecs=20
startretries=10
stopwaitsecs=900
stopasgroup=true
killasgroup=true
environment=SUPOCLIP_SERVICE="worker"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
