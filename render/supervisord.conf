; SupoClip all-in-one process supervisor.
; Programs start in priority order; supervisord waits for each priority group
; to be RUNNING (startsecs elapsed) before starting the next group.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supoclip/supervisord.pid
childlogdir=/run/supoclip

[unix_http_server]
file=/run/supoclip/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supoclip/supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /data/pgdata
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --protected-mode yes --save "" --appendonly no --maxmemory-policy noeviction
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backend]
command=bash -c ". /run/supoclip/env.sh && export DATABASE_URL=\"$BACKEND_DATABASE_URL\" && exec /app/.venv/bin/uvicorn src.main:app --host 127.0.0.1 --port 8000"
directory=/app
priority=30
autostart=true
autorestart=true
startsecs=25
startretries=10
stopwaitsecs=30
environment=SUPOCLIP_SERVICE="backend"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:frontend]
command=bash -c ". /run/supoclip/env.sh && cd /app-frontend && (prisma migrate deploy || echo '[frontend] WARN: prisma migrate deploy failed, continuing') && exec node --require ./server-request-timeout.cjs server.js"
directory=/app-frontend
priority=50
autostart=true
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=30
environment=PORT="3107",HOSTNAME="127.0.0.1",NODE_ENV="production",PRISMA_QUERY_ENGINE_LIBRARY="/app-frontend/prisma-engine/libquery_engine-debian-openssl-3.0.x.so.node"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Optional processes are added by the entrypoint via [include] files in
; /render/programs/:
;   - worker.conf     (video + cron worker; skipped when ENABLE_VIDEO_WORKER=0
;                      - the 512 MB free plan cannot hold the worker's
;                      cv2/whisper imports alongside the rest of the stack)
;   - ai-worker.conf  (AI edit queue; ENABLE_AI_WORKER=1)
[include]
files=/render/programs/*.conf

[program:nginx]
command=bash -c "exec nginx -c /run/supoclip/nginx.conf"
priority=90
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
